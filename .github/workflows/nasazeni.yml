name: Nasazení na GitHub Pages

on:
  push:
    branches: [claude/admiring-euler-ci2d58]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Údaje Supabase jsou v src/lib/nastaveni.ts – publishable klíč, do prohlížeče patří
      # VITE_BASE=/ protože appka běží na vlastní doméně v kořeni, ne
      # v podsložce /tourdepub/ jako na michaelbedna13.github.io.
      - run: npm run build
        env:
          VITE_BASE: /
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
