<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Tour de Pub — Brno edition</title>
<meta name="description" content="Zapisování čárek při Tour de Pub: devět brněnskejch špeluněk, úkoly a pořadí part.">
<meta name="theme-color" content="#070E0A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tour de Pub">
<!-- Hagrid z Adobe Fonts (kit thr1dyh). Načítá se stranou, ne jako blokující
     styl: appka musí vykreslit tmavý podklad a logo hned, i kdyby Adobe
     neodpovídalo. Když se kit nenačte (bez signálu, mimo povolenou doménu),
     spadne písmo na Bricolage a Outfit uložené v appce — viz src/styles/app.css.
     POZOR: v nastavení kitu na fonts.adobe.com musí být povolená doména
     michaelbedna13.github.io, jinak Adobe nevydá nic. -->
<link rel="preconnect" href="https://use.typekit.net" crossorigin>
<link rel="stylesheet" href="https://use.typekit.net/thr1dyh.css"
  media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://use.typekit.net/thr1dyh.css"></noscript>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/ikona.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/ikona-180.png">
<!-- Úvodní obrazovky pro appku na ploše iPhonu. Bez nich ukáže iOS při
     spuštění jen prázdnou barvu. Generuje scripts/uvodni-obrazovky.mjs. -->
<link rel="apple-touch-startup-image" href="/uvodni/320x568@2x.png"
  media="(device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="/uvodni/375x667@2x.png"
  media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="/uvodni/414x736@3x.png"
  media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="/uvodni/375x812@3x.png"
  media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="/uvodni/414x896@2x.png"
  media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="/uvodni/414x896@3x.png"
  media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="/uvodni/390x844@3x.png"
  media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="/uvodni/428x926@3x.png"
  media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="/uvodni/393x852@3x.png"
  media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="/uvodni/430x932@3x.png"
  media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="/uvodni/402x874@3x.png"
  media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="/uvodni/440x956@3x.png"
  media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<style>
  /* Rovnou v hlavičce, ne ve stylu: než se stáhne app.css, kreslí prohlížeč
     bílou a na tmavé appce to zabliká. Tohle platí od prvního vykreslení. */
  html,body{background:#070E0A;margin:0}
  /* Logo je rovnou ve stránce, ne z Reactu, aby naskočilo dřív, než se stáhne
     skript, a navázalo na obrázek, který ukazuje iOS při spuštění z plochy.
     React pak vykreslí to svoje na přesně stejné místo a tohle odklidí
     (<Uvod> v src/components/Uvod.tsx).

     Žádné prolnutí ani změna velikosti: React převezme logo kdykoli během
     načítání, a kdyby se tu zrovna prolínalo, skočila by jeho jasnost z půlky
     na plnou. Buď obrázek ještě není, nebo je — nic mezi tím. */
  #uvod{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#070E0A}
  #uvod img{width:52vw;max-width:260px;height:auto;display:block}
</style>
</head>
<body>
<div id="uvod"><img src="/logo-uvodni.svg" alt="Tour de Pub" width="450" height="359"></div>
<div id="app"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
