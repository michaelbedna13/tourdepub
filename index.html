<style>
  /* Rovnou v hlavičce, ne ve stylu: než se stáhne styl.css, kreslí prohlížeč
     bílou a na tmavé appce to zabliká. Tohle platí od prvního vykreslení. */
  html,body{background:#070E0A;margin:0}
  #uvod{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#070E0A}
  #uvod img{width:52vw;max-width:260px;height:auto;display:block;opacity:0}
</style>
<link rel="stylesheet" href="styl.css">
</head>
<body>
<!-- Úvodní obrazovka. Je rovnou ve stránce, ne z JS, aby naskočila hned
     a navázala na tu, kterou ukazuje iOS při spuštění z plochy. -->
<div id="uvod"><img src="logo-uvodni.svg" alt="Tour de Pub" width="450" height="359"
  onload="this.dataset.nacteno=1" onerror="this.dataset.nacteno=1"></div>

<div class="app">
  <!-- Překresluje se jen obsah obrazovky. Lišta stojí mimo, jinak by při
       každém zápisu zmizela a objevila se znovu. -->
  <div id="obrazovka"></div>
</div>
<div class="lista-obal"><nav class="lista" id="lista" aria-label="Hlavní"></nav></div>
<div id="okno"></div>
<script type="module" src="app.js"></script>
<script>
  // Dřív tu byl service worker kvůli běhu bez signálu. V hospodách na trase
  // signál je, takže nic nepřinášel a jen bránil tomu, aby se nová verze
  // dostala do telefonu. Tohle po něm uklidí na zařízeních, kde ještě zůstal.
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.getRegistrations()
      .then((r) => r.forEach((x) => x.unregister()))
      .catch(() => {});
    if (window.caches) caches.keys().then((k) => k.forEach((x) => caches.delete(x))).catch(() => {});
  }
</script>
</body>
